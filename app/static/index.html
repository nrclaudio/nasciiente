<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>INTERFACE 2037</title>
<style>
  :root {
    --ink: #cfe8cf;          /* MU/TH/UR pale phosphor */
    --ink-mid: #7fb37f;
    --ink-dim: #3f5f3f;
    --amber: #e8c46a;
    --bg: #010401;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { min-height: 100%; background: #000; }
  body {
    color: var(--ink);
    font-family: "SF Mono", "Menlo", "DejaVu Sans Mono", "Consolas", monospace;
    font-size: 14px;
    display: flex; align-items: flex-start; justify-content: center;
  }
  /* ---- the CRT itself (grows with content; footer rides its bottom) --- */
  #crt {
    position: relative; width: 100%; max-width: 1560px; margin: 14px;
    min-height: calc(100vh - 28px);
    background:
      radial-gradient(ellipse 120% 90% at 50% 45%,
        rgba(120,200,120,.06) 0%, transparent 55%),
      var(--bg);
    border-radius: 38px / 30px;
    border: 2px solid #0c140c;
    box-shadow:
      inset 0 0 130px rgba(0,0,0,.92),
      inset 0 0 24px rgba(90,160,90,.14),
      0 0 42px rgba(40,90,40,.28);
    padding: 46px 58px 60px;
    overflow: hidden;
  }
  #crt::before {   /* scanlines */
    content: ""; position: absolute; inset: 0; pointer-events: none; z-index: 60;
    background: repeating-linear-gradient(0deg,
      rgba(0,0,0,.28) 0 1px, transparent 1px 3px);
    border-radius: inherit;
  }
  #crt::after {    /* rolling interference band */
    content: ""; position: absolute; left: 0; right: 0; height: 90px;
    pointer-events: none; z-index: 61;
    background: linear-gradient(180deg, transparent,
      rgba(160,255,160,.045), transparent);
    animation: roll 9s linear infinite;
  }
  @keyframes roll { 0% { top: -18%; } 100% { top: 118%; } }
  .glow { text-shadow: 0 0 8px rgba(150,255,150,.45); }
  ::selection { background: var(--ink); color: #000; }

  /* ---- MU/TH/UR chrome ------------------------------------------------ */
  header { display: flex; justify-content: space-between; align-items: center;
           letter-spacing: .28em; font-size: 12.5px; color: var(--ink-mid);
           border-bottom: 1px solid var(--ink-dim); padding-bottom: 10px; }
  header .badge { background: var(--ink); color: #000; padding: 2px 10px;
                  letter-spacing: .28em; font-weight: bold; }
  #mother { text-align: center; margin: 42px 0 30px; }
  #mother .title { font-size: 26px; letter-spacing: .55em; text-indent: .55em;
                   color: var(--ink); }
  #mother .sub { margin-top: 12px; font-size: 13px; letter-spacing: .3em;
                 color: var(--ink-mid); min-height: 1.2em; white-space: pre; }

  nav { display: flex; gap: 34px; justify-content: center; margin: 8px 0 26px;
        font-size: 12.5px; letter-spacing: .3em; }
  nav a { color: var(--ink-dim); cursor: pointer; padding: 3px 10px; }
  nav a.on { color: #000; background: var(--ink); }

  /* ---- inquiry line ---------------------------------------------------- */
  #promptline { display: flex; align-items: baseline; gap: 10px;
                font-size: 17px; margin: 4px 0 12px; text-transform: uppercase; }
  #promptline .ps1 { color: var(--ink-mid); letter-spacing: .12em; }
  #prompt { flex: 1; background: transparent; border: none; outline: none;
            color: var(--ink); font: inherit; text-transform: uppercase;
            letter-spacing: .12em; caret-color: transparent; }
  #cursor { width: .62em; height: 1.1em; background: var(--ink);
            display: inline-block; margin-left: -8px;
            animation: blink 1.1s steps(1) infinite;
            box-shadow: 0 0 9px rgba(150,255,150,.6); }
  @keyframes blink { 50% { opacity: 0; } }

  .chips { display: flex; gap: 10px; flex-wrap: wrap; margin-bottom: 16px; }
  .chips a { border: 1px solid var(--ink-dim); color: var(--ink-mid);
             padding: 2px 10px; font-size: 11.5px; letter-spacing: .18em;
             cursor: pointer; text-transform: uppercase; }
  .chips a:hover { background: var(--ink); color: #000; }

  #tuning { display: flex; flex-wrap: wrap; gap: 20px; align-items: center;
            font-size: 11.5px; letter-spacing: .16em; color: var(--ink-mid);
            text-transform: uppercase; border: 1px solid var(--ink-dim);
            padding: 10px 16px; margin-bottom: 20px; }
  #tuning input[type=range] { accent-color: var(--ink); width: 100px; }
  #tuning select, #tuning input[type=number] {
    background: #000; color: var(--ink); font: inherit;
    border: 1px solid var(--ink-dim); padding: 1px 6px; }
  button { background: #000; color: var(--ink); font: inherit;
    font-size: 12px; letter-spacing: .22em; border: 1px solid var(--ink-mid);
    padding: 5px 18px; cursor: pointer; text-transform: uppercase; }
  button:hover { background: var(--ink); color: #000;
    box-shadow: 0 0 16px rgba(150,255,150,.5); }
  button:disabled { opacity: .35; cursor: wait; }

  /* ---- readout panes ---------------------------------------------------- */
  #console { font-size: 13px; letter-spacing: .12em; color: var(--ink-mid);
             white-space: pre-wrap; min-height: 1.4em; margin-bottom: 14px;
             text-transform: uppercase; }
  #out { display: flex; flex-wrap: wrap; gap: 28px; }
  .pane { flex: 1 1 660px; max-width: 100%; }
  .pane .head { display: flex; justify-content: space-between;
    font-size: 11px; letter-spacing: .22em; color: var(--ink-mid);
    border: 1px solid var(--ink-dim); border-bottom: none;
    padding: 4px 10px; text-transform: uppercase; }
  .pane pre { font-size: 11.5px; line-height: 1.07; white-space: pre;
    border: 1px solid var(--ink-dim); padding: 12px 14px; color: var(--ink);
    overflow-x: auto; text-shadow: 0 0 6px rgba(150,255,150,.38);
    background: rgba(120,220,120,.02); min-height: 60px; }
  .pane .meta { display: flex; gap: 10px; margin-top: 7px; }

  /* ---- flight recorder --------------------------------------------------- */
  #gallery { display: none; }
  #gallery .row { display: flex; gap: 18px; align-items: center;
    font-size: 11.5px; letter-spacing: .18em; color: var(--ink-mid);
    text-transform: uppercase; margin-bottom: 14px; }
  #gallery pre { font-size: 11.5px; line-height: 1.07;
    border: 1px solid var(--ink-dim); padding: 12px 14px; color: var(--ink);
    overflow-x: auto; text-shadow: 0 0 6px rgba(150,255,150,.38); }

  footer { position: absolute; left: 58px; right: 58px; bottom: 18px;
    display: flex; justify-content: space-between; font-size: 10.5px;
    letter-spacing: .26em; color: var(--ink-dim); text-transform: uppercase; }
  #bootlog { display: none; }   /* machine-readable boot state for tests */
  .amber { color: var(--amber); }
</style>
</head>
<body>
<div id="crt">
  <header>
    <span>WEYLAND-YUTANI CORP · SYNTHETIC IMAGERY DIV</span>
    <span class="badge">MU/TH/UR 6000</span>
    <span>REF 180924609 · ASCII SYNTHESIS</span>
  </header>

  <div id="mother">
    <div class="title glow">INTERFACE 2037</div>
    <div class="sub" id="sub"> </div>
  </div>
  <div id="bootlog"></div>

  <nav>
    <a id="tab-draw" class="on">INQUIRY</a>
    <a id="tab-train">FLIGHT RECORDER</a>
  </nav>

  <section id="draw">
    <div id="promptline">
      <span class="ps1 glow">INQUIRY?</span>
      <input id="prompt" autocomplete="off" spellcheck="false"
             placeholder="DESCRIBE SUBJECT FOR SYNTHESIS" autofocus>
      <span id="cursor"></span>
    </div>
    <div class="chips" id="chips"></div>
    <div id="tuning">
      <label>GUIDANCE <input type="range" id="guidance" min="1" max="6"
             step="0.25" value="2"><span id="guidance-v">2.0</span></label>
      <label>STEPS <input type="number" id="steps" min="1" max="20"
             value="10" style="width:52px"></label>
      <label>MATRIX <select id="size">
        <option value="48,80">48×80</option>
        <option value="24,40">24×40</option>
        <option value="64,128">64×128</option></select></label>
      <label>RUNS <select id="vars">
        <option>1</option><option selected>2</option><option>4</option>
      </select></label>
      <label>INK BOOST <input type="range" id="bias" min="0" max="8"
             step="0.5" value="0"><span id="bias-v">0</span></label>
      <button id="go" class="glow">PROCESS ▸</button>
    </div>
    <div id="console"></div>
    <div id="out"></div>
  </section>

  <section id="gallery">
    <div class="row">
      <label>STAGE <select id="g-stage"></select></label>
      <label>EPOCH <input type="range" id="g-epoch" min="1" max="1"
             value="1"><span id="g-epoch-v"></span></label>
      <button id="g-play">PLAY ▸</button>
    </div>
    <pre id="g-view"></pre>
  </section>

  <footer>
    <span id="s-model">MODEL …</span>
    <span>SPECIAL ORDER 937 · SYNTHESIS PRIORITY ONE</span>
    <span id="s-device"></span>
  </footer>
</div>

<script>
"use strict";
const $ = id => document.getElementById(id);
const PRESETS = ["a goat", "a sailboat", "a castle", "a dragon",
                 "a rocket", "a skull", "two fish", "a windmill"];
let busy = false, samples = [];
const sleep = ms => new Promise(r => setTimeout(r, ms));

async function typeOut(el, text, cps = 28) {
  el.textContent = "";
  for (const ch of text) {
    el.textContent += ch;
    await sleep(1000 / cps);
  }
}

// ---- boot ---------------------------------------------------------------
async function boot() {
  await typeOut($("sub"), "INTERFACE 2037 READY FOR INQUIRY");
  try {
    const info = await (await fetch("/api/info")).json();
    $("bootlog").textContent = "ok: " + info.checkpoint;   // test hook
    $("s-model").textContent =
      `MODEL ${info.checkpoint.toUpperCase()} · ${info.params_m}M PARAMS` +
      (info.conditioned ? " · TEXT LINKED" : " · UNCONDITIONED");
    $("s-device").textContent = `PROCESSOR ${info.device.toUpperCase()}`;
    if (!info.conditioned)
      $("prompt").placeholder = "CHECKPOINT NOT TEXT-LINKED — FREE SYNTHESIS ONLY";
  } catch (e) {
    $("sub").textContent = "NO RESPONSE FROM SYNTHESIS CORE";
    $("sub").classList.add("amber");
  }
}

// ---- preset chips ---------------------------------------------------------
for (const p of PRESETS) {
  const b = document.createElement("a");
  b.textContent = p;
  b.onclick = () => { $("prompt").value = p; go(); };
  $("chips").appendChild(b);
}

// ---- inquiry ---------------------------------------------------------------
$("guidance").oninput = () =>
  $("guidance-v").textContent = (+$("guidance").value).toFixed(1);
$("bias").oninput = () => $("bias-v").textContent = $("bias").value;
$("go").onclick = go;
$("prompt").addEventListener("keydown", e => { if (e.key === "Enter") go(); });

async function go() {
  if (busy) return;
  busy = true; $("go").disabled = true;
  const [rows, cols] = $("size").value.split(",").map(Number);
  const prompt = $("prompt").value.trim();
  const body = {
    prompt, guidance: +$("guidance").value, steps: +$("steps").value,
    rows, cols, variations: +$("vars").value, space_bias: +$("bias").value,
  };
  $("out").innerHTML = "";
  const con = $("console");
  await typeOut(con, prompt
    ? `PROCESSING INQUIRY: ${prompt.toUpperCase()}`
    : "PROCESSING UNCONSTRAINED SYNTHESIS", 44);
  let dots = 0;
  const ticker = setInterval(() => {
    con.textContent = con.textContent.replace(/\.*$/, "")
      + ".".repeat(1 + dots++ % 4);
  }, 320);
  try {
    const resp = await fetch("/api/generate", {
      method: "POST", headers: {"Content-Type": "application/json"},
      body: JSON.stringify(body)});
    if (!resp.ok) throw new Error(await resp.text());
    const data = await resp.json();
    clearInterval(ticker);
    con.textContent = data.prompt_used
      ? `SYNTHESIS COMPLETE — ${data.results.length} RUN(S) — ` +
        `RANKED BY VISUAL MATCH`
      : `SYNTHESIS COMPLETE — ${data.results.length} RUN(S)`;
    data.results.forEach((r, i) => addPane(r, i));
  } catch (e) {
    clearInterval(ticker);
    con.textContent = "!! SYNTHESIS FAULT: " + e.message.slice(0, 160);
    con.classList.add("amber");
    setTimeout(() => con.classList.remove("amber"), 4000);
  }
  busy = false; $("go").disabled = false;
}

function addPane(r, i) {
  const pane = document.createElement("div");
  pane.className = "pane";
  const head = document.createElement("div");
  head.className = "head";
  const score = r.score != null
    ? `MATCH ${r.score.toFixed(3)}${i === 0 ? " ◈ BEST" : ""}` : "";
  head.innerHTML = `<span>RUN ${String(i + 1).padStart(2, "0")} · ` +
    `SEED ${r.seed}</span><span>${score}</span>`;
  const pre = document.createElement("pre");
  const meta = document.createElement("div");
  meta.className = "meta";
  for (const [name, fn] of [
      ["REPLAY", () => animate(pre, r.steps)],
      ["COPY", () => navigator.clipboard.writeText(r.final)],
      ["TXT", () => download(r.final)]]) {
    const b = document.createElement("button");
    b.textContent = name; b.onclick = fn; meta.appendChild(b);
  }
  pane.append(head, pre, meta);
  $("out").appendChild(pane);
  animate(pre, r.steps);
}

async function animate(pre, steps) {
  for (const s of steps) { pre.textContent = s; await sleep(85); }
}

function download(text) {
  const a = document.createElement("a");
  a.href = URL.createObjectURL(new Blob([text], {type: "text/plain"}));
  a.download = "synthesis.txt"; a.click();
}

// ---- flight recorder ---------------------------------------------------------
$("tab-draw").onclick = () => switchTab(true);
$("tab-train").onclick = () => switchTab(false);
function switchTab(draw) {
  $("draw").style.display = draw ? "" : "none";
  $("gallery").style.display = draw ? "none" : "";
  $("tab-draw").classList.toggle("on", draw);
  $("tab-train").classList.toggle("on", !draw);
  if (!draw && !samples.length) loadGallery();
}
async function loadGallery() {
  samples = (await (await fetch("/api/progress")).json()).samples;
  const stages = [...new Set(samples.map(s => s.stage))];
  $("g-stage").innerHTML = stages.map(s => `<option>${s}</option>`).join("");
  $("g-stage").onchange = setStage;
  $("g-epoch").oninput = showEpoch;
  $("g-play").onclick = playEpochs;
  if (stages.length) setStage();
  else $("g-view").textContent =
    "NO RECORDS — TRAINING WRITES ONE SYNTHESIS PER EPOCH";
}
const stageSamples = () =>
  samples.filter(s => s.stage === $("g-stage").value)
         .sort((a, b) => a.epoch - b.epoch);
function setStage() {
  const ss = stageSamples();
  $("g-epoch").max = ss.length; $("g-epoch").value = ss.length;
  showEpoch();
}
function showEpoch() {
  const ss = stageSamples();
  const s = ss[+$("g-epoch").value - 1];
  if (!s) return;
  $("g-epoch-v").textContent = `${s.epoch}/${ss[ss.length - 1].epoch}`;
  $("g-view").textContent = s.text;
}
async function playEpochs() {
  const ss = stageSamples();
  for (let i = 1; i <= ss.length; i++) {
    $("g-epoch").value = i; showEpoch(); await sleep(500);
  }
}

boot();
</script>
</body>
</html>
